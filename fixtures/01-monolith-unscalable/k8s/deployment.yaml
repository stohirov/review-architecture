apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopfront
spec:
  replicas: 3
  selector:
    matchLabels:
      app: shopfront
  template:
    metadata:
      labels:
        app: shopfront
    spec:
      containers:
        - name: shopfront
          image: registry.example.com/shopfront:1.4.0
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: shopfront-db
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
          volumeMounts:
            - name: uploads
              mountPath: /var/shopfront/uploads
      volumes:
        - name: uploads
          emptyDir: {}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shopfront
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shopfront
  minReplicas: 3
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
